<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#121212" />
    <title>Food Delivery</title>
    <link rel="stylesheet" href="/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <!-- Leaflet Map CSS and JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  </head>
  <body>
    <div id="app">
      <!-- Header -->
      <header id="main-header">
        <div class="user-info">
          <img src="https://i.pravatar.cc/100?img=1" alt="User Avatar" class="avatar">
          <div class="greeting">
            <span class="greeting-text">Good Evening</span>
            <span class="user-name">Alex Smith</span>
          </div>
        </div>
        <button id="cart-btn" class="icon-btn">
          <span class="material-icons-round">shopping_bag</span>
          <span id="cart-badge" class="badge">0</span>
        </button>
      </header>

      <!-- Main Content Area -->
      <main id="main-content">
        <!-- Home View -->
        <section id="view-home" class="view active">
          <div class="search-bar">
            <span class="material-icons-round search-icon">search</span>
            <input type="text" id="search-input" placeholder="Search for food, restaurants...">
            <button class="filter-btn"><span class="material-icons-round">tune</span></button>
          </div>
          
          <h2 class="section-title">Categories</h2>
          <div class="categories-scroll" id="categories-container">
            <!-- Populated by JS -->
          </div>

          <h2 class="section-title">Popular Restaurants</h2>
          <div class="restaurants-list" id="restaurants-container">
            <!-- Populated by JS -->
          </div>
        </section>

        <!-- Restaurant Details / Menu View -->
        <section id="view-restaurant" class="view">
          <div class="restaurant-hero" id="restaurant-hero">
             <button class="back-btn" onclick="app.navigate('home')"><span class="material-icons-round">arrow_back</span></button>
             <div class="hero-overlay"></div>
             <h1 id="restaurant-title">Restaurant Name</h1>
             <p id="restaurant-meta">4.5 ★ • 20-30 min • $$</p>
          </div>
          <div class="menu-list" id="menu-container">
            <!-- Populated by JS -->
          </div>
        </section>

        <!-- Orders View -->
        <section id="view-orders" class="view">
          <h2 class="page-title">Active Orders</h2>
          <div id="active-orders-container" class="orders-list">
             <!-- Populated by JS -->
          </div>
          <h2 class="page-title">Past Orders</h2>
          <div id="past-orders-container" class="orders-list">
             <!-- Populated by JS -->
          </div>
        </section>

        <!-- Map View -->
        <section id="view-map" class="view" style="padding: 0;">
          <div id="map-container" style="width: 100%; height: 100vh; position: absolute; top: 0; left: 0; z-index: 0;"></div>
        </section>

        <!-- Profile View -->
        <section id="view-profile" class="view">
          <h2 class="page-title">Profile</h2>
          <div class="profile-card">
            <img src="https://i.pravatar.cc/100?img=1" alt="User Avatar" class="avatar-large">
            <h3>Alex Smith</h3>
            <p id="profile-email">alex.smith@example.com</p>
            <button id="logout-btn" class="btn btn-primary mt-2">Log Out</button>
          </div>
        </section>
      </main>

      <!-- Cart Drawer -->
      <div id="cart-drawer" class="drawer">
        <div class="drawer-header">
          <h2>Your Cart</h2>
          <button id="close-cart-btn" class="icon-btn"><span class="material-icons-round">close</span></button>
        </div>
        <div class="drawer-content" id="cart-items-container">
          <!-- Populated by JS -->
        </div>
        <div class="drawer-footer">
          <div class="cart-total">
            <span>Total</span>
            <span id="cart-total-price">₹0</span>
          </div>
          <button id="checkout-btn" class="btn btn-primary btn-block">Checkout</button>
        </div>
      </div>
      <div id="drawer-overlay" class="overlay"></div>

      <!-- Auth Modal -->
      <div id="auth-modal" class="modal">
        <div class="modal-content glass">
          <h2 id="auth-title">Create Account</h2>
          <p id="auth-subtitle">Enter details to get started</p>
          
          <form id="email-form">
            <div class="input-group">
              <span class="material-icons-round">person</span>
              <input type="text" id="auth-name" placeholder="Full Name" required>
            </div>
            <div class="input-group">
              <span class="material-icons-round">email</span>
              <input type="email" id="auth-email" placeholder="Email Address" required>
            </div>
            <button type="submit" class="btn btn-primary btn-block">Send OTP</button>
          </form>
          
          <form id="otp-form" style="display: none;">
            <div class="input-group">
              <span class="material-icons-round">pin</span>
              <input type="text" id="auth-otp" placeholder="Enter 4-digit OTP" pattern="[0-9]{4}" required>
            </div>
            <button type="submit" class="btn btn-primary btn-block">Verify & Login</button>
            <p style="margin-top: 16px; font-size: 13px; color: var(--text-secondary); cursor: pointer; text-align: center;" onclick="app.resetAuth()">Change Email Address</p>
          </form>
        </div>
      </div>

      <!-- Bottom Navigation -->
      <nav id="bottom-nav">
        <button class="nav-item active" data-target="home">
          <span class="material-icons-round">home</span>
          <span>Home</span>
        </button>
        <button class="nav-item" data-target="map">
          <span class="material-icons-round">map</span>
          <span>Map</span>
        </button>
        <button class="nav-item" data-target="orders">
          <span class="material-icons-round">receipt_long</span>
          <span>Orders</span>
        </button>
        <button class="nav-item" data-target="profile">
          <span class="material-icons-round">person</span>
          <span>Profile</span>
        </button>
      </nav>
    </div>
    <script type="module" src="/main.js"></script>
  </body>
</html>
